name: Обновление результатов run5k
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Получить результаты
        run: python scripts/fetch_run5k.py
      - name: Сохранить изменения
        run: |
          if git diff --quiet -- run5k-results.json; then
            echo "Новых данных нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run5k-results.json
          git commit -m "Update run5k results"
          git push
